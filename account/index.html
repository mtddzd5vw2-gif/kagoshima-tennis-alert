<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <meta
      name="description"
      content="Tennis Court Watcher Phase 1の最小限のマイページ画面です。"
    >
    <title>マイページ | Tennis Court Watcher</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
    <script src="../assets/config/auth-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.js"></script>
    <script src="../assets/js/auth-foundation.js" defer></script>
  </head>
  <body data-page="account">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="../index.html">Tennis Court Watcher</a>
        <nav class="top-nav" aria-label="主要ナビゲーション">
          <a href="../index.html">空き状況</a>
          <a href="../auth/login.html">ログイン</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <p class="eyebrow">My account</p>
      <h1>マイページ</h1>
      <p class="notice" data-account-loading aria-live="polite">
        ログイン状態を確認しています…
      </p>

      <div class="account-grid" data-account-content hidden>
        <section class="account-card" aria-labelledby="account-status-title">
          <h2 id="account-status-title">アカウント状態</h2>
          <dl class="definition-list">
            <dt>ログイン状態</dt>
            <dd>ログイン中</dd>
            <dt>メールアドレス</dt>
            <dd data-account-email></dd>
            <dt>同意した規約</dt>
            <dd>同意履歴は準備中</dd>
          </dl>
        </section>

        <section class="account-card" aria-labelledby="account-actions-title">
          <h2 id="account-actions-title">アカウント操作</h2>
          <p class="muted">
            ログアウトできます。退会処理はまだ準備中です。
          </p>
          <div class="button-row">
            <button class="button button--secondary" type="button" data-sign-out disabled>
              ログアウト
            </button>
            <button class="button button--danger" type="button" disabled>
              退会する（準備中）
            </button>
          </div>
          <p class="status-text" data-action-status aria-live="polite"></p>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>© Tennis Court Watcher</span>
        <nav class="footer-links" aria-label="フッターナビゲーション">
          <a href="../index.html">空き状況</a>
          <a href="../legal/terms.html">利用規約</a>
          <a href="../legal/privacy.html">プライバシーポリシー</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
